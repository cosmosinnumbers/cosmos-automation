# Manual check of the backup writer (BACKUP_LLM_* secrets, e.g. Groq): one tiny JSON request, prints only which
# secrets are set, the model that answered and OK/FAIL. Never prints the key.
name: backup-llm-check

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: pip install -q requests PyYAML pillow numpy
      - env:
          BACKUP_LLM_URL: ${{ secrets.BACKUP_LLM_URL }}
          BACKUP_LLM_KEY: ${{ secrets.BACKUP_LLM_KEY }}
          BACKUP_LLM_MODELS: ${{ secrets.BACKUP_LLM_MODELS }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODELS: ${{ secrets.GLM_MODELS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in BACKUP_LLM_URL BACKUP_LLM_KEY BACKUP_LLM_MODELS GROK_API_KEY GLM_API_KEY; do [ -n "${!v}" ] && echo "$v: set" || echo "$v: MISSING"; done
          cd video/ytf && python -c "
          import sys; sys.argv=['x']
          import auto_short as a
          r = a.backup_llm([{'role': 'user', 'parts': [{'text': 'Answer with JSON only: {\"ok\": true}'}]}])
          print('backup writer (GLM first when GLM_API_KEY is set):', 'OK' if r and r[1].get('ok') else 'FAIL')
          sys.exit(0 if r else 1)"
