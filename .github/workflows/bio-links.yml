# Tracked Gumroad links in the Facebook Page and YouTube channel texts (tools/bio_links.py). Manual.
name: bio-links

on:
  workflow_dispatch:
    inputs:
      target:
        description: "facebook, youtube or audit (read-only report)"
        default: "facebook"
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -q requests PyYAML google-api-python-client google-auth google-auth-oauthlib tzdata
      - env:
          GUMROAD_JSON: ${{ secrets.GUMROAD_JSON }}
          META_JSON: ${{ secrets.META_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          THREADS_JSON: ${{ secrets.THREADS_JSON }}
        run: python video/ci_secrets.py
      - env:
          META_JSON: ${{ secrets.META_JSON }}
          THREADS_JSON: ${{ secrets.THREADS_JSON }}
          TARGET: ${{ inputs.target }}
          DRY: ${{ inputs.dry_run }}
        run: python tools/bio_links.py "$TARGET" $([ "$DRY" = "true" ] && echo --dry-run)
      - if: inputs.target == 'audit'
        run: |
          git config user.name "cosmos-bot"
          git config user.email "cosmos-bot@users.noreply.github.com"
          git add reports/bio-links.md
          git diff --cached --quiet && exit 0
          git commit -q -m "report: bio links"
          bash tools/git_sync.sh
