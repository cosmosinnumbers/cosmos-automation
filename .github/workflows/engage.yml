# Cosmos in Numbers: ManyChat-style replies to comments (and DMs once Meta grants Advanced Access), plus the
# channel LOOK UP comment under every new public YouTube video. Replaces the PC tasks cosmos-sky-replies (every 2 h)
# and cosmos-cta-comments (22:15), and the API part of cosmos-comment-replies (27/10/2026). No Claude tokens:
# tools/engage.py with Gemini for free-text comments. Rules and texts: config/engage.json. Docs: docs/engage.md.
# Crons are UTC = Italian winter time minus 1 h: 09:20, 11:20, 13:20, 15:20, 17:20, 19:20, 21:20, 23:20.
# Each run takes 1-3 minutes (short pauses only), ~8 runs a day: about 15-25 minutes a day of free Actions minutes.
# Off switch: repository variable ENGAGE_ENABLED=false, or Actions -> engage -> "Disable workflow".
name: engage

on:
  schedule:
    - cron: "20 8-22/2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read comments and show the replies, send nothing"
        type: boolean
        default: true
      only:
        description: "Comma-separated: yt,ig,fb,th,dm (empty = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: engage
  cancel-in-progress: false

jobs:
  engage:
    if: vars.ENGAGE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
      ENGAGE_DM: ${{ vars.ENGAGE_DM || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt google-api-python-client google-auth
      - name: Reply to comments
        id: run
        continue-on-error: true  # the logs below must be saved even when a platform failed
        env:
          META_JSON: ${{ secrets.META_JSON }}
          THREADS_JSON: ${{ secrets.THREADS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPIKEY3 }}
          IN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          args=()
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          [ -n "$IN_ONLY" ] && args+=(--only "$IN_ONLY")
          python tools/engage.py run "${args[@]}"
      - name: LOOK UP comment under new YouTube videos
        id: cta
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          IN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          python tools/engage.py cta "${args[@]}"
      - name: Save logs
        run: |
          git config user.name "cosmos-automation[bot]"
          git config user.email "cosmos-automation@users.noreply.github.com"
          git add logs
          git diff --cached --quiet && exit 0
          git commit -q -m "engage: replies log"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 10)); done
          exit 1
      - name: Report problems
        if: steps.run.outcome == 'failure' || steps.cta.outcome == 'failure'
        run: |
          echo "::error::engage.py reported problems: open the 'Reply to comments' / 'LOOK UP comment' step log."
          exit 1
