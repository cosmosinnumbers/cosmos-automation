# Read-only audit of the Gumroad store (tools/gumroad_audit.py): products, copy, covers, offer codes, sales of the last
# 90 days and the public pages as a visitor sees them. Commits reports/gumroad/. Never changes the store.
# Every Monday 09:00 Italian time + on demand from the Actions tab (also from the phone).
name: gumroad-audit

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -q requests tzdata
      - name: Secrets to files (never printed)
        env:
          GUMROAD_JSON: ${{ secrets.GUMROAD_JSON }}
        run: python video/ci_secrets.py
      - run: python tools/gumroad_audit.py
      - name: Save
        run: |
          git config user.name "cosmos-metrics[bot]"
          git config user.email "cosmos-metrics@users.noreply.github.com"
          git add reports/gumroad
          git diff --cached --quiet && exit 0
          git commit -q -m "gumroad: audit $(date +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 10)); done
          exit 1
