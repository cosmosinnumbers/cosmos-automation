# Gumroad UTM links per channel (tools/gumroad_utm.py): create them once, read the clicks every day after the metrics.
name: gumroad-utm

on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "create or stats"
        default: "create"

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  utm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -q requests
      - env:
          GUMROAD_JSON: ${{ secrets.GUMROAD_JSON }}
        run: python video/ci_secrets.py
      - env:
          ACTION: ${{ inputs.action || 'stats' }}
        run: python tools/gumroad_utm.py "$ACTION"
      - name: Save
        run: |
          git config user.name "cosmos-metrics[bot]"
          git config user.email "cosmos-metrics@users.noreply.github.com"
          git add -A config 07-analytics/metrics
          git diff --cached --quiet && exit 0
          git commit -q -m "gumroad: utm $(date +%F)"
          bash tools/git_sync.sh
