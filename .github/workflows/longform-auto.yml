# Weekly long video with no human step (owner 30/10/2026: "approva i video in automatico"): video/ytf/longform_auto.py
# plans the topic with primary sources, writes the script in beats, runs the checks (every number in the sources, a
# second model as reviewer, structure and pace) and approves it only if all pass; then longform-build makes the video
# and the release. Nothing is uploaded. Failed checks: an issue. Saturday 09:00 Italian time (summer: "0 7").
name: longform-auto

on:
  schedule:
    - cron: "0 8 * * 6"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic hint"
        default: ""
      minutes:
        description: "Length, e.g. 12-16 (empty = 8-10)"
        default: ""
      sources:
        description: "Comma-separated primary pages to use instead of Google Search (optional)"
        default: ""
      dry_run:
        description: "Dry run: plan, write and check the script only (no assets, no commit, no build)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write

concurrency: longform-auto

jobs:
  write:
    if: vars.LONGFORM_AUTO != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90  # act mode with the free writers: many small calls, a minute apart
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip}
      - run: pip install -q requests PyYAML pillow numpy scipy imageio-ffmpeg tzdata
      - name: Plan, write, check and approve
        id: auto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPIKEY3 }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          LLM_FIRST: ${{ vars.LLM_FIRST }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODELS: ${{ secrets.GLM_MODELS }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_MIN: ${{ inputs.minutes }}
          IN_SRC: ${{ inputs.sources }}
          IN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          [ -n "$IN_TOPIC" ] && args+=(--topic "$IN_TOPIC")
          [ -n "$IN_MIN" ] && args+=(--minutes "$IN_MIN")
          [ -n "$IN_SRC" ] && args+=(--sources "$IN_SRC")
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          python video/ytf/longform_auto.py "${args[@]}"
      - name: Commit and start the build
        if: steps.auto.outputs.id != ''
        env:
          ID: ${{ steps.auto.outputs.id }}
        run: |
          git config user.name "cosmos-bot"; git config user.email "cosmos-bot@users.noreply.github.com"
          git add "longform/$ID"
          git commit -q -m "video lungo approvato dai controlli: $ID"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          gh workflow run longform-build.yml -f id="$ID"
      - name: Issue if the checks failed
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (vars.SELF_HEAL == 'false' || github.event_name == 'workflow_dispatch')  # else self-heal.yml retries, fixes, then alerts
        run: |
          gh label create alert --color B60205 --description "Automazione fallita" 2>/dev/null || true
          gh issue create --title "Video lungo della settimana non approvato $(date +%d/%m/%Y)" --label alert \
            --body "I controlli automatici non sono passati. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
