# Daily metrics snapshot (video/ytf/metrics.py all: YouTube + Analytics, Instagram, Facebook, Threads, Gumroad,
# comments), read-only, free API quotas, no Claude tokens. Commits 07-analytics/metrics/*.jsonl: the PC tasks
# (cosmos-daily-content step 0b, cosmos-strategy-weekly) read them after a git pull instead of running metrics.py.
# 08:30 Italian time (winter), before the 09:00 / 10:00 PC tasks. TikTok Studio and Gumroad visits stay manual.
name: metrics

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q requests PyYAML google-api-python-client google-auth google-auth-oauthlib tzdata
      - name: Secrets to files (never printed)
        env:
          META_JSON: ${{ secrets.META_JSON }}
          THREADS_JSON: ${{ secrets.THREADS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_ANALYTICS_TOKEN_JSON: ${{ secrets.YOUTUBE_ANALYTICS_TOKEN_JSON }}
          GUMROAD_JSON: ${{ secrets.GUMROAD_JSON }}
        run: python video/ci_secrets.py
      - name: Snapshot
        run: timeout 600 python video/ytf/metrics.py all < /dev/null
      # Viral engine, steps 4-5: arm state every day (not only on Mondays) and follow-ups of the hits.
      - name: Learn from the experiments
        continue-on-error: true
        run: python tools/experiments.py learn
      # Cross-channel learning loop (owner 04/11/2026): every channel's numbers -> config/cross-weights.json, read by
      # day_clip (which clip goes out), auto_clips (which chapters become clips) and longform-auto (next topic).
      - name: Learn from every channel
        continue-on-error: true
        run: python tools/cross_learn.py learn
      - name: Save
        run: |
          git config user.name "cosmos-metrics[bot]"
          git config user.email "cosmos-metrics@users.noreply.github.com"
          git add 07-analytics/metrics config/experiments-state.json config/cross-weights.json
          git add reports/apprendimento-canali-*.md 2>/dev/null || true
          [ -f queues/ideas.json ] && git add queues/ideas.json
          git diff --cached --quiet && exit 0
          git commit -q -m "metrics: daily snapshot $(date +%F)"
          bash tools/git_sync.sh
