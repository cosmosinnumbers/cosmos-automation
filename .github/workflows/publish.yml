# Cosmos in Numbers: publishes the due queue items (Meta, Threads, X, TikTok) at the exact minute.
# Crons are UTC = Italian winter time minus 1 h (CET, from 25/10/2026): 11:45, 15:45, 18:45, 20:45.
# 15 min early since 27/10/2026: GitHub started the :58 crons 20-25 min late on 26/10. AHEAD_MIN (25) covers the wait;
# 30 min early was rejected: worst case 4 x 31 min/day would exceed the 2,000 free Actions minutes of a private repo.
# The script then waits for the "at" minute of each item (12:00, 16:00, 19:00, 21:00): 2 min of waiting, not 5,
# to stay well inside the free Actions minutes of a private repo (26/10/2026).
# 13:00 slot (TikTok "dati" Short) removed while TIKTOK_ENABLED is false: add back "58 11 * * *" when TikTok is on.
# Italian time all year (30/10/2026): the second set of crons is the same slots in summer time (CEST, from
# 28/03/2027). The off-season set runs 1 h early (nothing due within AHEAD_MIN: no-op) or 1 h late (items already
# published: no-op; an item the on-time run missed goes out late, within LATE_MAX_MIN).
# Reversible: disable this workflow from the Actions tab (or `gh workflow disable publish`).
name: publish

on:
  schedule:
    - cron: "45 10 * * *"
    - cron: "45 14 * * *"
    - cron: "45 17 * * *"
    - cron: "45 19 * * *"
    - cron: "45 9 * * *"     # summer time (CEST)
    - cron: "45 13 * * *"
    - cron: "45 16 * * *"
    - cron: "45 18 * * *"
    - cron: "45 15 * * 3-5"  # summer: 17:45 for the Threads quiz at 17:55 Wed-Fri (in winter the 16:45 UTC run above does it)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check queues, media, pacing and credentials without publishing"
        type: boolean
        default: true
      only:
        description: "Comma-separated channels (meta,threads,x,tiktok); empty = all"
        type: string
        default: ""
      ref:
        description: "Publish only this queue ref, ignoring its time window (tests)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
      META_ENABLED: ${{ vars.META_ENABLED || 'true' }}
      THREADS_ENABLED: ${{ vars.THREADS_ENABLED || 'true' }}
      X_ENABLED: ${{ vars.X_ENABLED || 'true' }}
      TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'false' }}
      TIKTOK_AIGC_LABEL: ${{ vars.TIKTOK_AIGC_LABEL || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Publish due items
        env:
          META_JSON: ${{ secrets.META_JSON }}
          THREADS_JSON: ${{ secrets.THREADS_JSON }}
          X_JSON: ${{ secrets.X_JSON }}
          TIKTOK_JSON: ${{ secrets.TIKTOK_JSON }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          IN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          IN_ONLY: ${{ inputs.only }}
          IN_REF: ${{ inputs.ref }}
        run: |
          git config user.name "cosmos-automation[bot]"
          git config user.email "cosmos-automation@users.noreply.github.com"
          args=()
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          [ -n "$IN_ONLY" ] && args+=(--only "$IN_ONLY")
          [ -n "$IN_REF" ] && args+=(--ref "$IN_REF")
          python tools/run_slot.py "${args[@]}"

  youtube:
    # Off until Google approves the YouTube API audit (AUDIT_APPROVED in yt_api.py). Then set the repository
    # variable YT_ENABLED=true and the secret YOUTUBE_TOKEN_JSON: Shorts upload private with publishAt.
    if: vars.YT_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: youtube
    env:
      TZ: Europe/Rome
      YT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt google-api-python-client google-auth
      - name: Schedule due YouTube uploads
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          git config user.name "cosmos-automation[bot]"
          git config user.email "cosmos-automation@users.noreply.github.com"
          python tools/yt_publish.py
# cron re-registered after account reinstatement (09/11/2026)
