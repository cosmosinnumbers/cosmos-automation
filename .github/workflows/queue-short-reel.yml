# The daily Short (shorts-build release) becomes IG Reel, FB Reel, IG Story and FB Story in the Meta queue (30/10/2026);
# and, with TIKTOK_ENABLED=true, the TikTok post at 21:00 (queues/tiktok-queue.json, 1/11/2026);
# publish.yml publishes them at the minute, meta_api.guard() keeps the anti-ban limits. No Claude, no PC. Switch off with the repo variable SHORT_REEL_ENABLED=false.
name: queue-short-reel

on:
  workflow_run:
    workflows: [shorts-build]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = today's Short)"
        default: ""
      dry_run:
        description: "Dry run: print the item, change nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: queue-short-reel

jobs:
  queue:
    if: vars.SHORT_REEL_ENABLED != 'false' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q requests imageio-ffmpeg tzdata  # ffmpeg for the 19 s Story cut
      - name: Queue the Reel
        env:
          GH_TOKEN: ${{ github.token }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'false' }}
        run: |
          args=()
          [ -n "${{ inputs.tag }}" ] && args+=(--tag "${{ inputs.tag }}")
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          python tools/queue_short_reel.py "${args[@]}"
      - name: Remove published media from the repo
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: python tools/media_cleanup.py
      - name: Commit the queue
        run: |
          git config user.name "cosmos-bot"; git config user.email "cosmos-bot@users.noreply.github.com"
          git add queues/meta-queue.json queues/tiktok-queue.json
          git add -A media
          git diff --cached --quiet && exit 0
          git commit -m "coda Meta: Reel IG e FB e Storie dello Short del giorno"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
