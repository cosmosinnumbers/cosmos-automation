# Daily niche research (free official APIs, no scraping, no Claude tokens): every day 07:00 Italian time.
# Writes research/<niche>/<YYYY-Www>.md (refreshed daily within the week) and research/<niche>/gemini-<date>.md
# (Gemini watches the 3 fastest-growing competitor videos not seen yet), read by the cosmos-strategy-weekly task.
# A source without credentials is skipped and the report says so.
name: research

on:
  schedule:
    - cron: "0 6 * * *"   # 07:00 CET (summer time: "0 5 * * *")
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche file in research/niches (empty = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: research

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt vaderSentiment pytrends
      - name: Research
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_JSON: ${{ secrets.REDDIT_JSON }}
          META_JSON: ${{ secrets.META_JSON }}
          IN_NICHE: ${{ inputs.niche }}
        run: |
          niches="$IN_NICHE"
          [ -z "$niches" ] && niches=$(ls research/niches | sed 's/\.json$//')
          for n in $niches; do python tools/research.py "$n"; done
      - name: Gemini watches competitor videos
        continue-on-error: true  # a Gemini failure must not lose the research reports
        timeout-minutes: 10      # 31/10/2026: a quota-exhausted Gemini ran into the job timeout and the reports were lost
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPIKEY3 }}  # the secret was saved as GEMINIAPIKEY3
          IN_NICHE: ${{ inputs.niche }}
        run: |
          niches="$IN_NICHE"
          [ -z "$niches" ] && niches=$(ls research/niches | sed 's/\.json$//')
          for n in $niches; do python tools/gemini_watch.py "$n" 3; done
      - name: Trend scout (viral engine, step 1)
        continue-on-error: true
        env:
          IN_NICHE: ${{ inputs.niche }}
        run: |
          niches="$IN_NICHE"
          [ -z "$niches" ] && niches=$(ls research/niches | sed 's/\.json$//')
          for n in $niches; do python tools/trend_scout.py "$n" || echo "trend scout $n failed"; done
      # News radar (13/11/2026): which space stories people read today (Google News, Reddit, Hacker News, Wikipedia
      # pageviews, Google Trends, agencies: free public feeds, no key). Read by the Short writer and the planner.
      - name: News radar
        continue-on-error: true
        timeout-minutes: 8
        env:
          IN_NICHE: ${{ inputs.niche }}
        run: python tools/news_radar.py "${IN_NICHE:-cosmos}"
      - name: Save reports
        if: always()
        run: |
          git config user.name "cosmos-automation[bot]"
          git config user.email "cosmos-automation@users.noreply.github.com"
          git add research
          git diff --cached --quiet || (git commit -q -m "research: weekly reports" && bash tools/git_sync.sh)
# cron re-registered after account reinstatement (09/11/2026)
