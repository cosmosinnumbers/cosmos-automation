# Self-heal (owner request 02/11/2026): when a listed workflow fails on its own (cron, chained run, or started by
# another workflow), this re-runs its failed jobs (config/self-heal.json: 0-2 times, after 2 then 6 minutes), and if
# it still fails asks an LLM to repair the code: Gemini, Groq, GLM, GitHub Models (free, keys already set), then
# Claude only if the secret ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN exists. A fix that compiles and keeps the tests
# green becomes a PR, merged automatically only if it touches no publisher, token, queue, log, deletion or workflow;
# then the failed run is re-run to verify it. The owner gets an issue (label alert, e-mail) only when this fails.
# No double posts: re-runs check out the tip of main, where the publishers' logs say what is already out.
# Limits: max 1 autofix per workflow every 20 h and 4 a day (logs/autofix-log.jsonl). Manual runs are not touched.
# Off switches (repository variables): SELF_HEAL=false (everything), AUTOFIX=false (only the LLM fix).
name: self-heal

on:
  workflow_run:
    workflows: [publish, youtube-upload, threads-build, queue-short-reel, shorts-build, reserve-build, longform-auto,
                longform-build, metrics, research, strategy, tokens, health, engage, sfx-library,
                day-guard]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  models: read
  id-token: write

concurrency:
  group: self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  heal:
    # only failures of automatic runs, only their first attempt (re-runs are followed by the job that started them)
    if: >-
      vars.SELF_HEAL != 'false' && github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event != 'workflow_dispatch' || github.event.workflow_run.triggering_actor.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 120  # known failures wait up to 15 min more (config "known"); every minute here is billed
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      AUTOFIX_ENABLED: ${{ vars.AUTOFIX != 'false' }}
      HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip}
      - run: pip install -q -r requirements.txt PyYAML pytest numpy scipy pillow soundfile
      - name: Re-run the failed jobs (backoff)
        id: retry
        run: python tools/self_heal.py retry
      - name: Diagnose and fix with a free LLM
        id: diag
        if: steps.retry.outputs.result == 'failed'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPIKEY3 }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
        run: python tools/self_heal.py diagnose
      - name: Fix with Claude (only if its secret exists)
        if: >-
          steps.diag.outputs.status == 'nofix' && env.HAS_CLAUDE == 'true' &&
          contains(fromJSON('["code","unknown",""]'), steps.diag.outputs.kind)
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python -m pytest:*),Bash(python -m py_compile:*),Bash(git diff:*)"
          prompt: |
            The GitHub Actions workflow "${{ github.event.workflow_run.name }}" of this repository failed
            (run ${{ github.event.workflow_run.html_url }}). The failed log, the workflow file and the related source
            files are in ./.autofix/context.md: read it first.
            Find the root cause and fix it with the SMALLEST change to the repository files. Rules: do not edit
            .github/, queues/, logs/ or secrets; never delete content, disable checks or tests, or remove the
            publishers' idempotency (logs); no git commit or push (the next step does it). Check with
            `python -m py_compile <file>` and `python -m pytest -q tests`.
            If it is not fixable in code (HTTP 429/5xx, expired token, quota, a secret to set), change nothing.
            In both cases write 1-3 sentences IN ITALIAN for the owner (what broke, why, what you changed or what
            the owner must do) to ./.autofix/claude-diagnosis.txt.
      - name: PR, safe merge, verification or issue
        if: steps.retry.outputs.result == 'failed'
        run: python tools/self_heal.py finish
