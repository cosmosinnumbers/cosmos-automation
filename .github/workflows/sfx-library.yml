# Sound-effects library from Openverse + Freesound (a valid key for at least one), CC0 only (owner 02/11/2026: "search Openverse first, let Real SFX place the
# hits, generate what is missing"). tools/sfx_library.py searches api.openverse.org (no key), downloads up to
# `per_kind` CC0 sounds for every kind used by video/ytf/sfx.py, normalises them into assets/sfx/openverse/ and
# records title, author, page and licence in assets/sfx/library.json. The renders pick from it; kinds with no
# CC0 sound keep the sound synthesised in code. Monthly, or "Run workflow".
name: sfx-library

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      per_kind:
        description: "CC0 sounds per kind (whoosh, impact, glitch, key...)"
        default: "4"
      dry_run:
        description: "Only list what would be taken"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: sfx-library

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # no key: Openverse allows only a few anonymous searches an hour, so each run fills what it can and stops
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -q numpy scipy soundfile imageio-ffmpeg PyYAML requests
      - name: Search and download CC0 sounds
        env:
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          PER: ${{ inputs.per_kind || '4' }}
          DRY: ${{ inputs.dry_run }}
        run: |
          args=(--per-kind "$PER"); [ "$DRY" = "true" ] && args+=(--dry-run)
          python tools/sfx_library.py "${args[@]}"
      - name: Commit the library
        if: inputs.dry_run != true
        run: |
          git config user.name "cosmos-automation[bot]"; git config user.email "cosmos-automation@users.noreply.github.com"
          git add assets/sfx; git diff --cached --quiet && exit 0
          git commit -q -m "sfx: libreria Openverse CC0 aggiornata"
          bash tools/git_sync.sh
