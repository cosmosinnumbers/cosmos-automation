# Cosmos in Numbers: one news Short a day built in the cloud, no Claude tokens (owner decision 27/10/2026:
# "tutto su GitHub, Short con Gemini"). Gemini (Google Search) writes it, video/ytf/auto_short.py checks sources and
# numbers, downloads real NASA footage and renders it with the same pipeline as the PC (Kokoro voice, short.py).
# Result: a GitHub release "aMMDD-<slug>" with the mp4, upload.md (title + description) and factcheck.md.
# Nothing is uploaded: YouTube stays in Studio (API audit), Instagram/TikTok take only clips of the long videos.
# The owner downloads it on the phone (release notes = title and description ready to copy, guida GUIDA-TELEFONO.txt)
# and uploads it from the YouTube app for 21:00 (decision of 30/10/2026).
# 06:30 Italian time (winter), before research.yml (07:00) so the Gemini quota goes to the Short first; retries at
# 11:00 and 15:00 only if today's release is missing. Writer: Gemini, then a backup LLM (BACKUP_LLM_* secrets, else GitHub Models) on the RSS path,
# same fact check. At 15:00 without a Short: the first ready Short of reserve/, otherwise an issue "Short non uscito".
# Crons in UTC (summer time: one hour less). Off switch: repository variable SHORTS_ENABLED=false.
name: shorts-build

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
    - cron: "30 11 * * *"   # 12:30 Italian time (winter): SECOND Short of the day, hot news of the last 48 h (owner 03/11/2026)
  workflow_dispatch:
    inputs:
      second:
        description: "Second Short of the day (hot news, release b<MMDD>-*, YouTube at 15:00)"
        type: boolean
        default: false
      topic:
        description: "Optional topic hint for Gemini (e.g. 'Europa Clipper')"
        type: string
        default: ""
      dry_run:
        description: "Dry run: write and fact-check the script, no footage, no render, no release"
        type: boolean
        default: false

permissions:
  contents: write
  models: read
  issues: write

concurrency:
  group: shorts-build

jobs:
  build:
    if: vars.SHORTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
      # second Short of the day (12:30 cron or the "second" input): prefix b, hot news, no retries, no reserve, no alert
      SECOND: ${{ github.event.schedule == '30 11 * * *' || inputs.second == true }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - name: Today's Short already out?
        id: today
        run: |
          p=a; [ "$SECOND" = "true" ] && p=b
          if [ "$SECOND" = "true" ] && [ "${{ vars.SECOND_SHORT_ENABLED }}" = "false" ]; then
            echo "Second Short switched off (SECOND_SHORT_ENABLED=false)."; echo "done=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep "^$p$(date +%m%d)-" | head -1 || true)
          if [ -n "$tag" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Today's Short is already out ($tag): nothing to do."; echo "done=true" >> "$GITHUB_OUTPUT"
          fi
          [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%H)" -ge 14 ] && echo "last=true" >> "$GITHUB_OUTPUT"; true
      - uses: actions/setup-python@v7
        if: steps.today.outputs.done != 'true'
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.today.outputs.done != 'true'
        run: pip install -q kokoro-onnx espeakng-loader phonemizer-fork onnxruntime soundfile numpy scipy pillow matplotlib fonttools imageio-ffmpeg PyYAML requests tzdata
      # motion graphics: the 11 Remotion scenes in motion/ (video/ytf/motion.py). If this step fails the video is
      # still built, with plain footage and synthesised sounds (owner 02/11/2026: "devono essere bellissimi").
      - uses: actions/setup-node@v5
        if: steps.today.outputs.done != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Motion graphics (Remotion + headless Chrome)
        if: steps.today.outputs.done != 'true'
        continue-on-error: true
        run: |
          cd motion && npm ci --no-audit --no-fund
          node -e "import('@remotion/renderer').then(m => m.ensureBrowser()).then(() => console.log('chrome ok'))"
      - name: Kokoro voice model (cached)
        if: steps.today.outputs.done != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - if: steps.today.outputs.done != 'true'
        run: |
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          [ -s kokoro-v1.0.onnx ] || curl -sSLf -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -s voices-v1.0.bin ] || curl -sSLf -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      # Viral engine, step 4 (docs/PROMPT-motore-virale.md): format + hook of today's Short from tools/experiments.py
      # (sky event, follow-up of a hit, or Thompson sampling 80/20 on the metrics). A failure here = a plain Short.
      - name: Choose today's variant
        id: plan
        if: steps.today.outputs.done != 'true'
        continue-on-error: true
        run: |
          args=(); [ "$SECOND" = "true" ] && args+=(--hot)
          python tools/experiments.py plan "${args[@]}"
      - name: Write and render the Short
        id: short
        if: steps.today.outputs.done != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPIKEY3 }}
          BACKUP_LLM_URL: ${{ secrets.BACKUP_LLM_URL }}
          BACKUP_LLM_KEY: ${{ secrets.BACKUP_LLM_KEY }}
          BACKUP_LLM_MODELS: ${{ secrets.BACKUP_LLM_MODELS }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          LLM_FIRST: ${{ vars.LLM_FIRST }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODELS: ${{ secrets.GLM_MODELS }}
          IN_TOPIC: ${{ inputs.topic || steps.plan.outputs.topic }}
          IN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          P_FORMAT: ${{ steps.plan.outputs.format }}
          P_HOOK: ${{ steps.plan.outputs.hook }}
          P_IDEA: ${{ steps.plan.outputs.idea }}
          P_SOURCE: ${{ steps.plan.outputs.source }}
        run: |
          args=()
          [ -n "$IN_TOPIC" ] && args+=(--topic "$IN_TOPIC")
          [ -n "$P_FORMAT" ] && args+=(--format "$P_FORMAT" --hook "$P_HOOK" --source "$P_SOURCE")
          [ -n "$P_IDEA" ] && args+=(--idea "$P_IDEA")
          [ "$SECOND" = "true" ] && args+=(--hot --prefix b)
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          python video/ytf/auto_short.py "${args[@]}"
      - name: "Publish as a release (private repo, only the owner can download it)"
        if: steps.short.outputs.id != ''
        env:
          ID: ${{ steps.short.outputs.id }}
          DIR: ${{ steps.short.outputs.dir }}
        run: |
          title=$(python -c "import json,os;print(json.load(open(os.environ['DIR']+'/result.json'))['title'])")
          cp "$DIR/short/short.yaml" "$DIR/material/assets.yaml" "$DIR/material/script.yaml" "$DIR/"
          mv "$DIR/assets.yaml" "$DIR/material-assets.yaml"; mv "$DIR/script.yaml" "$DIR/material-script.yaml"
          # Phase D of the viral plan: automatic video QC. Hard errors stop the release (variable QC_BLOCK=false only reports).
          qc=0
          python tools/video_qc.py "$DIR/short/out/$ID.mp4" --kind short --script "$DIR/result.json" --md "$DIR/qc.md" || qc=$?
          cat "$DIR/qc.md" >> "$DIR/factcheck.md" || true
          if [ "$qc" != "0" ] && [ "${{ vars.QC_BLOCK }}" != "false" ]; then echo "::error::video QC failed, no release"; exit 1; fi
          python tools/phone_notes.py "$DIR/short/out/upload.md" "$DIR/factcheck.md" "$DIR/phone.md"
          social=(); [ -f "$DIR/short/out/${ID}_social.mp4" ] && social=("$DIR/short/out/${ID}_social.mp4")
          gh release create "$ID" --title "$title" --notes-file "$DIR/phone.md" \
            "$DIR/short/out/$ID.mp4" "${social[@]}" "$DIR/short/out/upload.md" "$DIR/factcheck.md" "$DIR/short.yaml" \
            "$DIR/material-assets.yaml" "$DIR/material-script.yaml"
      - name: Log the variant (experiments)
        if: steps.short.outputs.id != ''
        continue-on-error: true  # the release is out: a log failure must not turn the run red
        env:
          DIR: ${{ steps.short.outputs.dir }}
        run: |
          python tools/experiments.py record "$DIR/result.json"
          git config user.name "cosmos-automation[bot]"; git config user.email "cosmos-automation@users.noreply.github.com"
          git add logs/experiments.jsonl queues/ideas.json 2>/dev/null || git add logs/experiments.jsonl
          git diff --cached --quiet && exit 0
          git commit -q -m "esperimenti: variante di ${{ steps.short.outputs.id }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
      - name: Keep the blocked video for inspection (QC failed)
        if: failure() && steps.short.outputs.id != ''
        uses: actions/upload-artifact@v7
        with:
          name: blocked-${{ steps.short.outputs.id }}
          path: |
            ${{ steps.short.outputs.dir }}/short/out/*.mp4
            ${{ steps.short.outputs.dir }}/short/build/motion_plan.json
            ${{ steps.short.outputs.dir }}/qc.md
          retention-days: 3
      - name: Reserve Short (last attempt of the day)
        id: reserve
        if: github.event_name == 'schedule' && env.SECOND != 'true' && steps.today.outputs.done != 'true' && steps.short.outputs.id == '' && steps.today.outputs.last == 'true'
        continue-on-error: true
        run: |
          python tools/reserve_short.py
          git config user.name "cosmos-automation[bot]"; git config user.email "cosmos-automation@users.noreply.github.com"
          git add -A reserve; git diff --cached --quiet && exit 0
          git commit -q -m "riserva: usato ${{ github.run_id }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
      - name: Alert if no Short today
        if: env.SECOND != 'true' && steps.today.outputs.done != 'true' && steps.short.outputs.id == '' && steps.reserve.outputs.used == '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          if [ "${{ steps.today.outputs.last }}" != "true" ]; then
            echo "No Short at this attempt: next try at 11:00 or 15:00."; exit 0
          fi
          title="Short non uscito $(date +%d/%m/%Y)"
          body="Tutti i tentativi di oggi sono falliti e la riserva è vuota. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ vars.SELF_HEAL }}" = "false" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh label create alert --color B60205 --description "Automazione fallita" 2>/dev/null || true
            gh issue create --title "$title" --body "$body" --label alert --assignee Redwraith || gh issue create --title "$title" --body "$body" --label alert
          else
            echo "$title: self-heal.yml re-runs it once, then tries a fix and opens the issue if nothing works."
          fi
          exit 1
