# Long video on YouTube via the API (owner 03/11/2026: "il caricamento lo fai sempre via api youtube").
# After every successful longform-build, and every day at 10:00 Italian time as a safety net, tools/yt_long_upload.py
# uploads the oldest lf-<id> release not yet on the channel as a scheduled video: public on the next free Sunday
# at 16:00 (one long video per Sunday), with English captions and the thumbnail. Never twice (log + channel titles).
# Off switch: repository variable YOUTUBE_LONG_ENABLED=false.
name: youtube-long-upload

on:
  workflow_run:
    workflows: [longform-build]
    types: [completed]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag lf-<id> (empty = oldest not uploaded)"
        type: string
        default: ""
      replace:
        description: "videoId of our long video to DELETE and upload again from its rebuilt release (owner's ok only)"
        type: string
        default: ""
      reschedule:
        description: "videoId of our scheduled long video to move to the date in 'at' (owner's ok only)"
        type: string
        default: ""
      at:
        description: "New public date and time for reschedule, Italian time: YYYY-MM-DD HH:MM"
        type: string
        default: ""
      dry_run:
        description: "Dry run: check release, title and slot, upload nothing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    if: vars.YOUTUBE_LONG_ENABLED != 'false' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt google-api-python-client google-auth
      - name: Upload the long video
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          IN_TAG: ${{ inputs.tag }}
          IN_REPLACE: ${{ inputs.replace }}
          IN_RESCHEDULE: ${{ inputs.reschedule }}
          IN_AT: ${{ inputs.at }}
          IN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          [ -n "$IN_TAG" ] && args+=(--tag "$IN_TAG")
          [ -n "$IN_REPLACE" ] && args+=(--replace "$IN_REPLACE")
          [ -n "$IN_RESCHEDULE" ] && args+=(--reschedule "$IN_RESCHEDULE" --at "$IN_AT")
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          python tools/yt_long_upload.py "${args[@]}"
      - name: Save the log
        if: always()
        run: |
          git config user.name "cosmos-automation[bot]"; git config user.email "cosmos-automation@users.noreply.github.com"
          git add logs; git diff --cached --quiet && exit 0
          git commit -q -m "log: youtube (video lungo)"
          bash tools/git_sync.sh
      - name: Open an issue if the upload failed
        if: failure() && github.event_name != 'workflow_dispatch'
        run: |
          gh label create alert --color B60205 --description "Automazione fallita" 2>/dev/null || true
          gh issue create --title "YouTube: video lungo non caricato $(date +%d/%m/%Y)" --label alert --assignee Redwraith \
            --body "Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || gh issue create --title "YouTube: video lungo non caricato $(date +%d/%m/%Y)" --label alert --body "Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
