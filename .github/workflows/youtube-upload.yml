# Daily Short on YouTube via the API, public at 21:00 Rome time (owner decision 30/10/2026: the test upload
# C-BKdHUodpE stayed public). After shorts-build it only checks; the 20:45 run waits and uploads at 21:00.
# Never twice (logs/youtube-publish-log.jsonl + titles on the channel). The LOOK UP channel comment is posted by
# engage.yml (cta) on its next run; pinning stays manual. Off switch: repository variable YOUTUBE_UPLOAD_ENABLED=false.
name: youtube-upload

on:
  workflow_run:
    workflows: [shorts-build, long-clips]
    types: [completed]
  schedule:
    - cron: "45 19 * * *"   # 20:45 Italian time in winter (CET)
    - cron: "45 13 * * *"   # 14:45: SECOND Short of the day (b<MMDD>-*, hot news), public at 15:00 (owner 03/11/2026)
    - cron: "45 18 * * *"   # 20:45 in summer (CEST, from 28/03/2027); off-season it only checks (19:45) or is a no-op (21:45)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload now (empty = today's Short, at 21:00)"
        type: string
        default: ""
      dry_run:
        description: "Dry run: check release, title and duplicates, upload nothing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    if: vars.YOUTUBE_UPLOAD_ENABLED != 'false' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Rome
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.ref }}"}  # tip of the branch: a re-run sees the logs of the attempt before (self-heal)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt google-api-python-client google-auth
      - name: Upload today's Short
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          SHORT_PREFIX: ${{ github.event.schedule == '45 13 * * *' && 'b' || 'a' }}
          UPLOAD_AT: ${{ github.event.schedule == '45 13 * * *' && '15:00' || '21:00' }}
          IN_TAG: ${{ inputs.tag }}
          IN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          [ -n "$IN_TAG" ] && args+=(--tag "$IN_TAG")
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          python tools/yt_short_upload.py "${args[@]}"
      - name: Save the log
        if: always()
        run: |
          git config user.name "cosmos-automation[bot]"; git config user.email "cosmos-automation@users.noreply.github.com"
          git add logs; git diff --cached --quiet && exit 0
          git commit -q -m "log: youtube"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
      - name: Open an issue if the upload failed
        if: failure() && github.event_name != 'workflow_dispatch' && vars.SELF_HEAL == 'false'  # else self-heal.yml retries, fixes, then alerts
        run: |
          gh label create alert --color B60205 --description "Automazione fallita" 2>/dev/null || true
          gh issue create --title "YouTube: Short non caricato $(date +%d/%m/%Y)" --label alert --assignee Redwraith \
            --body "Caricamento YouTube fallito. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || gh issue create --title "YouTube: Short non caricato $(date +%d/%m/%Y)" --label alert --body "Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
