- id: c5
  act: Shrinking
  sources:
  - S1
  - S2
  - S3
  narration: 'The red giant does not stay at full size. When its core gets hot enough, helium ignites.
    Helium starts fusing into carbon, which also releases energy. For a while, that new fuel props the
    star up again. ESA''s Gaia team describes what happens next: the star recedes to a radius of about
    10 times the current solar value. Ten times wider than today is still a giant star, just far smaller
    than its peak of about 200 times. Then the giant becomes unstable. In NASA''s description it starts
    pulsating, expanding and throwing off parts of its atmosphere. Eventually all the outer layers blow
    away into an expanding cloud of dust and gas called a planetary nebula. You have probably seen one
    in a photo. That glowing shell is a dying star giving its material back to the galaxy. Sun-like stars
    of every age in Gaia''s data are how astronomers piece together these late stages of a star like ours.
    Gaia''s catalogue holds about 440,000 orbital solutions for binary stars: pairs born together, with
    the same age, to test these stages. Quick recap: a giant that shrinks to about 10 times today''s size,
    pulses, and blows away its outer layers. So what is left in the middle?'
