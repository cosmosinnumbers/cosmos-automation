- id: c4
  act: No supernova
  sources:
  - S3
  narration: 'Here is the myth to drop. Our Sun will never go supernova. It does not have the mass. NASA
    explains that neutron stars, the leftovers of supernovae, come from stars with between about eight
    and 20 times the Sun''s mass. Those heavy stars fuse heavier and heavier elements, until the core
    collapses, rebounds, and the star blows up as a supernova. What is left of them can be a neutron star.
    Some of those, called pulsars, spin faster than blender blades. A star like ours below eight solar
    masses takes the quieter road: red giant, then a slow unravelling. If calm cosmic numbers like these
    make your day, follow the channel. There is a new one every day. And if you want to find these objects
    in your own sky, our beginner''s guide LOOK UP shows you where. The link in the description. Main
    sequence stars range from a tenth to 200 times the Sun''s mass. Ours sits near the bottom of that
    range. Main sequence stars make up around 90% of the universe''s stars. The Sun is ordinary, and ordinary
    stars die gently. But gently does not mean quietly. What does a giant star do once it has swallowed
    its neighbours?'
