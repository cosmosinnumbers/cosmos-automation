- id: c3
  act: Red giant
  sources:
  - S1
  - S2
  - S3
  - S6
  - S7
  narration: 'When the hydrogen in the core runs out, the core contracts and heats up. The outside does
    the opposite. According to NASA, the Sun will become a red giant in about 5 billion years. ESA''s
    Gaia study of Sun-like stars puts it around 10–11 billion years of age. The outer layers swell to
    up to about 200 times the current solar radius. Picture standing next to that. Its diameter today
    is about 1.4 million kilometers. As a red giant, it would stretch across the orbits of Mercury and
    Venus. Today the Sun''s radius is 695,700 kilometers. Two hundred times that is about 139 million
    kilometers. Now compare. Earth orbits at a mean distance of 149.6 million kilometers from the Sun.
    That is uncomfortably close. According to NASA, the red giant will engulf Mercury and Venus, and possibly
    Earth as well. Venus, our closest planetary neighbour, would be swallowed by the same star that has
    kept it warm for billions of years. Astronomers can already tell apart red giants that have not reached
    their maximum radius from those that have ignited helium. So far: a red giant up to about 200 times
    wider, engulfing Mercury and Venus, and possibly Earth. Is that an explosion?'
