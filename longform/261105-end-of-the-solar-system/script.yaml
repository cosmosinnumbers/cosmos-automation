- id: c1
  act: Intro
  sources:
  - S1
  - S7
  narration: 'How long do you think our Sun has left? The honest answer is stranger than any doomsday
    movie. ESA''s article on Gaia gives our Sun an age of around 4.57 billion years: in its comfortable
    middle age. By the end you''ll know what Gaia''s study of Sun-like stars says happens to our Sun as
    it ages. Here is your first guess. What ends first: life on Earth, the planet Mercury, or the Sun
    itself? Right now the Sun is stable. It fuses hydrogen into helium in a core of about 15 million degrees
    Celsius. It sits about 150 million kilometers away, yet its light still warms every ocean you have
    ever swum in. That fusion pushes outward against gravity. As long as the push and the pull stay balanced,
    the Sun stays the Sun. It is huge. According to NASA, it would take 1.3 million Earths to fill the
    Sun''s volume. And it holds 99.8% of all the mass in our Solar System. Everything else, you included,
    is a rounding error. But fuel never lasts forever. So what runs out first, and what does that mean
    for the planet you are sitting on?'
