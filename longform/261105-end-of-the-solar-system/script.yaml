- id: c6
  act: White dwarf
  sources:
  - S3
  - S4
  - S6
  - S8
  narration: 'What remains is the bare core: a white dwarf. According to NASA, a white dwarf is usually
    Earth-size but hundreds of thousands of times more massive. Think about that squeeze. The Sun''s radius
    today is 695,700 kilometers. Earth''s is 6371. That is a ratio of 109.2. A white dwarf Sun would be
    squeezed down to about Earth''s size. A teaspoon of white dwarf material would weigh more than a pickup
    truck. Would you try to lift it? It makes no new heat. It just glows and slowly cools over billions
    of years. Despite the name, white dwarfs can glow from blue white to red as they slowly cool. When
    does the Sun reach this stage? NASA pages give about 8 billion years and about 10 billion years from
    now. And the surviving outer planets? NASA''s Spitzer found about 40 white dwarfs with hot, dusty
    disks. Astronomers think leftover planets can fling small rocky bodies inward, where the dead star
    tears them apart. So the Sun ends as a faint, cooling ember. Or could something even bigger reach
    us first?'
