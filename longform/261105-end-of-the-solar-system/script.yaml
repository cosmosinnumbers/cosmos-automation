- id: c2
  act: Earth's deadline
  sources:
  - S1
  - S5
  - S6
  - S7
  narration: 'Here is the twist most people miss. Earth does not wait for the Sun to die. Our deadline
    comes much sooner. NASA''s article on the Hubble and Gaia galaxy study states it: the warming Sun
    makes Earth uninhabitable in roughly 1 billion years. Today the Sun''s surface glows at an effective
    temperature of 5772 Kelvin. A hotter, brighter Sun pours more heat onto us. Comparing it with Sun-like
    stars of different ages, the Gaia team found it reaches a maximum temperature at approximately 8 billion
    years of age. Subtract today''s age and that peak is about 3.43 billion years away. Earth''s deadline
    comes long before that. So life on Earth runs out of time first, billions of years before the red
    giant. Did you guess that? Tell me in the comments. To find this, Gaia''s team picked stars with the
    same mass and chemistry as the Sun, but different ages. They found 5863 solar analogues. Lined up
    by age, those stars trace our Sun''s past and its future. That is the beauty of the method. You cannot
    watch one star for billions of years, but you can watch thousands at once. And what those stars show
    next is far more dramatic than a hot planet. What happens when the core runs dry?'
