- id: c7
  act: Andromeda
  sources:
  - S5
  narration: 'You have probably heard that our galaxy will crash into Andromeda. As far back as 1912,
    astronomers saw it heading our way. In 2012, a Hubble analysis made the collision seem much more likely,
    indicating a direct impact in no more than 5 billion years. Then a new study used Hubble and Gaia
    together. It tested 22 different variables and ran 100,000 simulations. The result: approximately
    a 50-50 chance of the two galaxies colliding within the next 10 billion years. The chance of a head-on
    collision in only 4 to 5 billion years is just around 2%. Andromeda''s satellite galaxy M33 pulls
    us a little toward it, while the Large Magellanic Cloud pulls the Milky Way away. In about half the
    simulations the galaxies pass each other at around half a million light-years, then merge in the far
    future. So the Sun''s own story ends first. As the researchers put it, Andromeda is the least of our
    cosmic worries. Earth uninhabitable in roughly 1 billion years, a red giant in about 5 billion, a
    white dwarf after that. The galaxy? A coin toss. If you want to see Andromeda yourself, a faint smudge
    you can find on a dark night, LOOK UP shows you how. Link in the description. Which ending surprised
    you most: Earth''s deadline, the giant Sun or the coin toss? Write it below.'
