description_intro: How our Solar System ends, step by step, using ESA Gaia results on the Sun's past and
  future, NASA pages on stellar evolution and the Sun, and the 2025 Hubble and Gaia study on the Milky
  Way and Andromeda. Dates far in the future are model estimates, and NASA pages differ on some of them.
