- id: c3
  act: A planet
  sources:
  - S3
  - S4
  - S9
  narration: 'Object two is a planet. When Jupiter is in your sky, it looks like a very bright point of
    light. At its best, Jupiter reaches an apparent visual magnitude of -2.94, according to NASA''s Jupiter
    fact sheet. Its distance from us changes a lot, because both planets move. The minimum is 588.5 million
    kilometers, the maximum 968.5 million. Even at its closest, Jupiter''s light needs about 33 minutes
    to reach you. So the Jupiter you see tonight is a picture that left the planet more than half an hour
    earlier. And it is enormous. Jupiter''s equatorial radius is 71,492 kilometers, about 11 times Earth''s.
    Saturn can take the planet slot too. With its rings, its maximum apparent visual magnitude is -0.55.
    Saturn is much farther away: between 1205.5 and 1658.6 million kilometers from Earth. So which planet
    will you catch first, the bright giant or the ringed one? Planets live inside our own Solar System.
    The next object on the list sits far beyond it. But how far, exactly?'
