- id: c4
  act: The Pleiades
  sources:
  - S5
  - S9
  narration: 'Object three is the Pleiades, also called the Seven Sisters, an open star cluster in the
    constellation Taurus. NASA describes this bright open cluster of stars as easy to see with the unaided
    eye. It sits roughly 445 light-years from Earth, though NASA notes that this number is not universally
    agreed upon. So the light you see from it set off about 445 years before it reaches your eye tonight.
    The cluster contains over a thousand stars loosely bound by gravity, but a handful of bright members
    dominate the view. Its apparent magnitude is 1.6, much fainter than Jupiter, yet easy to spot from
    a relatively dark site. Galileo Galilei was the first to observe the Pleiades through a telescope.
    You can do it with nothing at all. According to NASA, the best time to observe it is December. How
    many of its stars can you count from where you live? If you want a map for nights like this, our beginner''s
    stargazing guide LOOK UP shows you where to look. The link is in the description. So far: the Moon,
    then Jupiter or Saturn, and now the Pleiades at about 445 light-years. So what is waiting just below
    Orion''s belt?'
