- id: c6
  act: Andromeda
  sources:
  - S7
  - S9
  - S11
  narration: 'Object five is the Andromeda Galaxy, the nearest major galaxy to our own Milky Way. NASA
    puts it at about 2.5 million light-years away. It is by far the farthest object on our list. A century
    ago, Edwin Hubble showed that this spiral was far outside our galaxy, roughly 25 Milky Way diameters
    away. Its light left Andromeda about 2.5 million years ago. You are seeing the galaxy as it was back
    then. With an apparent magnitude of 3.1, according to NASA, it can be seen with the naked eye, even
    with moderate light pollution. On a very clear autumn night it looks like a faint cigar-shaped glow,
    roughly as wide as the Moon appears. That faint glow holds an estimated 1 trillion stars. Hubble can
    resolve more than 200 million of them. And this is its season: according to NASA, Andromeda is best
    observed in November. Have you ever seen it with your own eyes? Hubble''s portrait of it needed over
    1,000 orbits, spanning more than a decade. The first known report comes from the Persian astronomer
    al-Sufi, in The Book of Fixed Stars from the year 964. So far: the Moon, a planet, the Pleiades, the
    Orion Nebula, and now Andromeda at about 2.5 million light-years. So what do you do tonight?'
