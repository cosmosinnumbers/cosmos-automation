- id: c2
  act: The Moon
  sources:
  - S1
  - S2
  - S9
  - S10
  narration: 'Object one is the Moon, and it is much farther away than most drawings make it look. It
    is an average of 384,400 kilometers away. According to NASA, 30 Earth-sized planets could fit in that
    gap. And the distance is not fixed. According to NASA''s fact sheet, it roughly ranges from 357,000
    to 407,000 kilometers. Light covers about 300,000 kilometers every second. Divide 384,400 by 300,000,
    and moonlight needs about 1.3 seconds to reach you. At full Moon, its mean apparent visual magnitude
    is about -12.74. That is the brightest thing in the night sky. Keep one rule in mind for the rest
    of the list: on the magnitude scale, the lower the number, the brighter the object. Now look at the
    dark patches. Those maria are impact basins that were filled with lava between 4.2 and 1.2 billion
    years ago. The bright highlands around them are older crust. One crater there, Tycho, is more than
    85 kilometers wide. Here is a question for the comments. Before today, how far away did you think
    the Moon was? So far: the Moon, about 384,400 kilometers and 1.3 light-seconds away. Next comes a
    light that is not a star at all. But which one?'
