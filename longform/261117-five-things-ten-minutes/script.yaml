  - S10
  narration: 'How far can your naked eye really see? Much farther than most people guess, and you can
    check it tonight. By the end you''ll know five things anyone can find in about ten minutes, with no
    telescope, and how far away each one is. The nearest one on our list is about 384,400 kilometers away.
    The farthest one on our list is about 2.5 million light-years away. So here is a quick guess before
    we start. Which of the five do you think is the farthest thing your eyes can reach? First, the ruler
    we will use. A light-year is the distance light travels in one Earth year: about 9 trillion kilometers.
    Light moves at about 300,000 kilometers per second. Even at that speed, the night sky always shows
    you the past. Even daylight is old. The Sun''s light takes about 8.3 minutes to reach us, so you always
    see the Sun as it was. The farther away an object is, the older the light that lands in your eyes
    tonight. So every object on this list is also a time machine, each one with a different delay. We
    start with the easiest one of all. What could be simpler than the Moon? Yet its numbers are stranger
    than they look.'
