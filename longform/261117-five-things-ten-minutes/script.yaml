  - S8
  narration: 'Object four hides in one of the best known patterns in the sky: Orion. Look just below Orion''s
    belt. There sits Messier 42, the Orion Nebula. According to NASA, you can spot it with the unaided
    eye from a dark sky site. It is only 1,500 light-years away, the closest large star-forming region
    to Earth. Its apparent magnitude is about 4, fainter than the Pleiades, so give your eyes a few minutes
    in the dark. It is a stellar nursery: an enormous cloud of dust and gas where vast numbers of new
    stars are being forged. Hubble''s sharpest view of it used 520 different exposures, and the mosaic
    holds over one billion pixels. At its heart, four massive young stars called the Trapezium shape the
    nebula and carve a cavity with ultraviolet light. Orion also holds Betelgeuse, an aging red supergiant
    about 725 light-years away. It is so big that, if it replaced the Sun, its surface would extend past
    the orbit of Jupiter. Can you picture that? Betelgeuse dimmed in late 2019. But that dimming really
    happened around the year 1300. Its light only just arrived. Hundreds of light-years, then 1,500. Yet
    the last object breaks the scale completely.'
