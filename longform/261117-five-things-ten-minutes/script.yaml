- id: c7
  act: Your ten minutes
  sources:
  - S5
  - S6
  - S7
  - S9
  - S10
  narration: 'Here is the ten-minute plan. Start with the Moon if it is up: it is the easiest warm-up,
    about 30 Earths away. Find Orion''s belt, then drop your eyes just below it for the fuzzy Orion Nebula.
    Then find the bright open cluster of the Pleiades, in the constellation Taurus. Finish with Andromeda,
    the faint smudge that is best observed in November. Remember the rule: the farther the object, the
    older its light. The Orion Nebula is about 1,500 light-years away, so its light is about 1,500 years
    old. Looking at Andromeda, you reach about 2.5 million light-years in one glance, and every light-year
    is about 9 trillion kilometers. No telescope, no app, no cost. Just your eyes, a dark corner and a
    few minutes of patience. Which object will you look for first tonight? Tell me in the comments, and
    tell me what you saw. If you want a full sky plan for every month of 2027, LOOK UP, our beginner''s
    stargazing guide, is linked in the description. And if real numbers about the night sky make your
    day, follow the channel. There is a new one every day.'
