- id: neptune
  chapter: 'Step 4: Neptune'
  sources:
  - S5
  narration: 'Step four: the edge of the planets. Neptune orbits about 4.5 billion kilometers from the Sun. Sunlight
    needs about four hours and ten minutes to get there.


    Here is the ladder so far. The Moon at 1.3 seconds. The Sun at 8 minutes. Mars, up to 22 minutes. Neptune, four
    hours. Each step is a big jump. But we have not even left the solar system yet.

    '
  visuals:
