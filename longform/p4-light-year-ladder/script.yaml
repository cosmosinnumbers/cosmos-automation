- id: voyager
  chapter: 'Step 5: Voyager 1'
  sources:
  - S1
  - S2
  narration: 'Step five: Voyager 1. It launched on September 5th, 1977, flew past Jupiter and Saturn, and kept going.
    NASA''s mission page gives its speed as about 17 kilometers per second relative to the Sun. That is more than
    61,000 kilometers per hour.


    On November 18th, at 2:16 in the morning, Pacific time, it reaches 25.902 billion kilometers from Earth. One
    light-day. A radio command from Earth takes a whole day to reach it, and the reply takes another day to come
    back.


    Back in August 2012, it became the first spacecraft to cross into interstellar space, the region beyond the
    bubble of particles blown out by the Sun. It is still sending data home today.


    It is the farthest and one of the fastest things we have ever sent. And after 49 years, it has covered one light-day.

    '
  visuals:
  - type: image
    src: img_v1launch
    motion: zoom_in
