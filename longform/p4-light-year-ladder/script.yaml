- id: lightyear
  chapter: What a light-year is
  sources:
  - S3
  - S4
  - S5
  narration: 'First, the ruler. Light in empty space moves at exactly 299,792,458 meters per second. That is no
    longer a measurement. Since 1983, it is a definition: the meter itself is defined by how far light travels in
    a fraction of a second.


    In one second, light could go around the Earth about seven and a half times.


    A light-year is simply how far light goes in one year. The International Astronomical Union puts it at about
    9.46 trillion kilometers. Write that out, and it is a nine followed by twelve more digits.


    It is a distance, not a time. But it hides a time inside it: when you see something one light-year away, you
    see it as it was one year ago. Hold on to that. It matters more with every step.


    Why not just use kilometers? Because the numbers stop meaning anything. The Andromeda Galaxy, near the top of
    our ladder, is about 24 quintillion kilometers away. In light-years, it is two and a half million. Still huge,
    but at least you can say it.

    '
  visuals:
  - type: counter
    value: 299792
    suffix: ' km/s'
    label: Speed of light
    sub: exact, by definition (BIPM)
    count: 1.8
  - type: image
    src: img_earth
    motion: zoom_out
    label: 7.5 laps of Earth per second
  - type: counter
