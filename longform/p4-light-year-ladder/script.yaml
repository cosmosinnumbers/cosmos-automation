- id: visible
  chapter: 'Step 7: the stars you can see'
  sources:
  - S8
  - S9
  narration: 'Step seven: the stars you can actually see. Sirius, the brightest star in the night sky, is about
    8.6 light-years away. The light reaching your eyes from it tonight left around eight and a half years ago.


    Now look just below the three stars of Orion''s belt. There is a faint, fuzzy patch. That is the Orion Nebula,
    a vast cloud where new stars are being born. NASA notes it is visible to the unaided eye from a dark site, and
    puts it at about 1,500 light-years away. The light you see from it left fifteen centuries ago.

    '
  visuals:
