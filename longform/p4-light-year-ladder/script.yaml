- id: milkyway
  chapter: 'Step 8: the Milky Way'
  sources:
  - S10
  narration: 'Step eight: our galaxy. The Milky Way is about 100,000 light-years across. Our solar system sits about
    26,000 light-years from its center.


    Practically every individual star you have ever seen in the night sky belongs to it. And the whole thing, all
    those stars, is still just one galaxy, one step on the ladder.

    '
  visuals:
  - type: video
    src: vid_milkyway_mountain
  - type: counter
    value: 100000
    suffix: ' light-years'
