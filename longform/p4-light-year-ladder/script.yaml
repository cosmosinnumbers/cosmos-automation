- id: moon
  chapter: 'Step 1: the Moon'
  sources:
  - S3
  - S5
  narration: 'Step one: the Moon. On average it orbits 384,400 kilometers from Earth. At the speed of light, that
    is just under 1.3 seconds.


    So the Moon you see tonight is the Moon of 1.3 seconds ago. And if you ever talked to someone standing on it,
    every answer would come back about two and a half seconds late: 1.3 seconds for your voice to get there, 1.3
    seconds for the reply to come home.

    '
  visuals:
  - type: video
    src: vid_moon_full
  - type: counter
    value: 1.28
    decimals: 2
    suffix: ' s'
    label: Light from the Moon
    sub: 384,400 km (NASA fact sheet)
    count: 1.4
- id: sun
  chapter: 'Step 2: the Sun'
  sources:
  - S4
  narration: 'Step two: the Sun. The average distance between Earth and the Sun is so useful that astronomers gave
    it its own unit, the astronomical unit, fixed by the IAU in 2012 at 149,597,870.7 kilometers.


    Light covers it in 499 seconds. That is 8 minutes and 19 seconds. The Sun you see is always the Sun of eight
    minutes ago. If it somehow vanished right now, the sky would stay bright, and you would feel nothing, for another
    eight minutes.

    '
  visuals:
  - type: video
    src: vid_sun
    start: 20
  - type: counter
    value: 499
    suffix: ' s'
    label: Light from the Sun
    sub: 8 min 19 s for 1 astronomical unit (IAU)
    count: 1.6
- id: mars
  chapter: 'Step 3: Mars'
  sources:
  - S5
  narration: 'Step three: Mars. Its distance from us changes all the time, because both planets are moving around
    the Sun. NASA''s fact sheet gives a minimum of 54.6 million kilometers, and a maximum of 401.4 million.


    So a radio signal takes between 3 and 22 minutes to get there, one way. That is why nobody drives a Mars rover
    with a joystick. By the time the rover heard "stop", it could already be in the crater. Commands are planned,
    sent ahead, and carried out by the rover on its own.

    '
  visuals:
  - type: image
    src: img_mars
    motion: zoom_in
    fit: contain
  - type: bars
    title: Radio signal, Earth to Mars, one way
    note: 'Source: NASA Mars fact sheet (min 54.6, max 401.4 million km) / speed of light'
