- id: ladder
  chapter: The whole ladder
  sources:
  - S1
  - S4
  - S5
  - S7
  - S8
  - S9
  - S10
  - S11
  - S13
  narration: 'Now put every step on one line, measured in light-travel time. 1.3 seconds. 8 minutes. 22 minutes.
    4 hours. One day. 4.2 years. 8.6 years. 1,500 years. 26,000 years. 2.5 million years. 13.5 billion years.


    The last step is more than 300,000 trillion times longer than the first.


    To feel that, shrink everything. Make the Moon''s 1.3 seconds equal to one millimeter, roughly the thickness
    of a credit card. On that scale, the Sun is about 39 centimeters away. Proxima Centauri is about 100 kilometers
    away. And MoM-z14 is more than 2,000 times the real distance from Earth to the Sun.


    And here is the part we like most. Several of these steps are in your own sky, no telescope needed. The Moon.
    Sirius. The Orion Nebula, this season, after midnight. And from a dark site, Andromeda.

    '
