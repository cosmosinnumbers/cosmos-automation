segments:
- id: hook
  chapter: Intro
  sources:
  - S1
  - S2
  - S7
  - S11
  narration: 'Twenty-five point nine billion kilometers. On November 18th, 2026, NASA''s Voyager 1 will reach that
    distance from Earth, and become the first human-made object ever to be one light-day away.


    It has been flying for 49 years. A command sent to it now takes almost a full day just to arrive.


    And on the scale of the universe, that is nothing. The nearest star is more than four light-years away. The
    most distant thing you can see with your own eyes is two and a half million light-years away.


    So today we climb the whole ladder, one step at a time, with real numbers. From the Moon, to the most distant
    galaxy ever confirmed.

    '
