description_intro: 'On Nov 18, 2026, NASA''s Voyager 1 becomes the first human-made object one light-day from Earth.
  We climb the whole distance ladder, from the Moon to the most distant galaxy Webb has confirmed. Travel times are
  our own arithmetic from the sources below.

  '
