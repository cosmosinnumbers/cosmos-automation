- id: edge
  chapter: 'Step 10: the edge of what we can see'
  sources:
  - S13
  - S14
  narration: 'Step ten: the edge. In January 2026, NASA announced that the Webb Space Telescope had confirmed a
    galaxy called MoM-z14. We see it as it was just 280 million years after the Big Bang.


    Its light has been traveling through expanding space for about 13.5 billion years, out of the universe''s 13.8.
    Because space has been stretching the whole time, the galaxy is much farther away than 13.5 billion light-years
    today. But that light is the oldest galaxy light anyone has confirmed.


    The stretching also changes the light itself. A redshift of 14.44 means every wavelength arrives about 15 and
    a half times longer than when it left. Light that started out as ultraviolet reaches us as infrared, which is
    exactly the kind of light Webb was built to collect.

    '
  visuals:
  - type: video
    src: vid_webb_mirrors
  - type: image
    src: img_deepfield
    motion: zoom_in
  - type: counter
    value: 13.5
    decimals: 1
    suffix: ' billion years'
