    count: 1.6
- id: andromeda
  chapter: 'Step 9: Andromeda'
  nasa_quote: easily visible with the unaided eye from a dark sky site   # verbatim, S11 (NASA Messier 31 page)
  sources:
  - S11
  - S12
  narration: 'Step nine: the Andromeda Galaxy. Two and a half million light-years away. And yet NASA says it is
    easily visible with the unaided eye from a dark-sky site. It looks like a faint, stretched smudge of light.
    That makes it the most distant thing most people will ever see with their own eyes.


    Think about what that light has been through. It left Andromeda about two and a half million years ago. Our
    own species, Homo sapiens, appeared only around 300,000 years ago. So when that light set out, there were no
    humans anywhere to see it. It was already more than two million years into its trip.

    '
  visuals:
  - type: image
    src: img_andromeda
    motion: zoom_in
