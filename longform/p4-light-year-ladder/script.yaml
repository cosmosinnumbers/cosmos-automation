    motion: zoom_in
- id: gap
  chapter: The jump to a light-year
  sources:
  - S1
  - S2
  - S4
  narration: 'Now stretch that. One light-year is 365 light-days. So a single light-year is 365 times farther than
    everything Voyager has managed in 49 years.


    At 17 kilometers per second, Voyager would need about 17,600 years to cover one light-year. Just one.

    '
  visuals:
  - type: kinetic
    text: 1 LIGHT-YEAR = 365 VOYAGER JOURNEYS
    accent:
    - '365'
  - type: counter
    value: 17600
    suffix: ' years'
    label: Voyager 1 to cover 1 light-year
    sub: 9.46 trillion km at 17 km/s (our arithmetic)
    count: 1.8
- id: proxima
  chapter: 'Step 6: the nearest star'
  sources:
  - S2
  - S6
  - S7
  - S15
  - S16
  narration: 'Step six: the nearest star, Proxima Centauri. Its light takes about 4.22 years to reach us.


    If Voyager 1 were pointed straight at it, which it is not, the trip would take roughly 74,000 years. Even NASA''s
    Parker Solar Probe, which reaches about 700,000 kilometers per hour when it swings closest to the Sun, the fastest
    object humans have ever built, would need around 6,500 years at that speed.


    And here is the twist: you cannot see Proxima at all. It is too faint for the naked eye. It was only discovered
    in 1915, with a telescope.


    It does have company. A planet called Proxima b orbits it, found in 2016, in the zone where the temperature
    could allow liquid water. The closest known planet outside our solar system, and still out of reach for any
    spacecraft we know how to build.

    '
  visuals:
  - type: image
    src: img_alphacen
    motion: zoom_in
  - type: bars
