description_intro: 'NASA''s Europa Clipper launched in 2024 and is currently scheduled to reach Jupiter in 2030.
  The mission plan calls for 49 science-dedicated flybys of Europa, plus separate gravity assists at Ganymede and
  Callisto. The dates and flyby count below describe NASA/JPL''s current plan, not completed events.


  Galileo data provide strong indirect evidence consistent with a salty ocean beneath Europa''s ice. Europa Clipper
  is designed to investigate whether Europa has conditions that could support life; it is not a direct life-detection
  mission.

  '
