segments:
- id: hook
  chapter: Intro
  sources:
  - S1
  - S3
  - S5
  narration: 'NASA is not planning to park a spacecraft in orbit around Europa. It is not sending a lander, either.
    The current mission plan sends Europa Clipper past the icy moon again and again: forty-nine science-dedicated
    flybys.


    Why design a mission that keeps rushing by its target? Because Europa circles Jupiter inside a harsh radiation
    environment. A low orbit around Europa could expose a spacecraft to damaging radiation for too long. Instead,
    Clipper will orbit Jupiter, swoop close to Europa, take measurements, then move back out to relay data and prepare
    for another pass.


    The strategy turns one destination into a sequence of changing views. Each close encounter can sample different
    terrain and different parts of the moon''s environment.


    But the number forty-nine is a plan, not a promise of forty-nine discoveries. The bigger question is what those
    passes can tell us about a world that may hide a global ocean beneath its ice.

    '
