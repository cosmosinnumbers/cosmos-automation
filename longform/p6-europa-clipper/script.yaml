- id: orbit_choice
  chapter: Why fly by instead of orbit
  sources:
  - S3
  - S5
  narration: 'The orbit choice is a trade. Jupiter''s radiation belts can damage a spacecraft''s electronics. An
    orbiter that stayed near Europa could receive a large radiation dose in a short time. A Jupiter orbit gives
    Clipper room to move outside the most intense region between close passes, downlink its observations, and prepare
    for the next encounter.


    The flybys also change the geometry. Each pass approaches a different area of Europa, and instruments can gather
    data from different altitudes and angles. Some planned passes may come within about twenty-five kilometers of
    the surface. That is close enough for detailed measurements, but Europa''s gravity is not what keeps the spacecraft
    in a permanent orbit.


    This plan depends on timing and navigation. The trajectory is shaped by Jupiter''s moons as well as the planets.
    Europa Clipper''s flight path uses gravity assists from Mars and Earth on the way out, and additional encounters
    in the Jupiter system to set up the mission''s orbit.


    A flyby is not a lesser visit. It is the central way this spacecraft will explore Europa while managing radiation
    and building a broad map over time.

    '
