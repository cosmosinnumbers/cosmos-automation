- id: forty_nine
  chapter: What 49 flybys mean
  sources:
  - S3
  - S4
  narration: 'The forty-nine planned Europa flybys are not forty-nine copies of the same measurement. The mission
    will pass different regions, at different angles and altitudes, while changing where it is in Jupiter''s radiation
    environment. The planned science campaigns cover the side of Europa facing away from Jupiter first, followed
    later by observations of the side facing Jupiter.


    The mission plan also includes seven additional flybys of Ganymede and nine of Callisto to help shape the tour.
    Those are separate from the forty-nine science-dedicated passes at Europa. Mixing them into one total would
    obscure what the number refers to.


    There is no complete public list of every future pass in the sources used here, so this video does not invent
    a sequence or assign a discovery to any one pass. The number describes the current mission design. Schedules
    can shift as navigation and operations evolve.


    If the measurements work as intended, Clipper can estimate properties such as the thickness of the ice shell,
    the ocean''s salinity, and whether material moves between the surface and the interior. Those would answer questions
    about habitability: whether the conditions needed for life could exist there.

    '
