- id: evidence
  chapter: What we know about the ocean
  sources:
  - S5
  - S6
  narration: 'Start with the evidence. The Galileo spacecraft passed through the Jupiter system in the nineteen-nineties
    and two-thousands. Its magnetometer measured changes in the magnetic field near Europa. The best explanation
    is that a conductive layer inside the moon responds to Jupiter''s changing magnetic field.


    A salty ocean beneath the ice is the interpretation that fits those measurements well. That is strong indirect
    evidence, but it is not the same as seeing the ocean directly or collecting a sample. No spacecraft has drilled
    through Europa''s ice. The ocean''s depth, salinity, and exchange with the surface remain uncertain.


    Hubble observations have also suggested possible plumes of water vapor, but those clues have not established
    a dependable, ongoing plume that Clipper can simply fly through. The mission will examine the surface and atmosphere
    for signs of activity, while keeping the distinction between evidence and confirmation clear.


    Europa''s ocean is therefore a scientific hypothesis supported by several lines of evidence, not a place we
    have visited or a source of life we have found. Europa Clipper is designed to test how strong that picture is.

    '
