- id: conclusion
  chapter: What the mission cannot promise
  sources:
  - S4
  - S5
  - S6
  narration: 'Europa Clipper is not a life detector. It will not land on Europa, drill through the ice, or bring
    an ocean sample back to Earth. The mission is designed to determine whether Europa has conditions that could
    support life, not to prove that life exists there.


    Today, the ocean is strongly suggested by indirect measurements. Possible plumes remain uncertain. The December
    twenty twenty-six Earth assist and the Jupiter arrival in twenty-thirty are parts of the current plan, not milestones
    already completed. The forty-nine flybys are a science campaign we are waiting to see unfold.


    That is what makes this mission compelling. It connects an old magnetic clue to a new set of measurements, then
    returns to Europa from many directions instead of trusting one close look. The best result may not be a dramatic
    image. It may be a better answer to a narrower question: how much of Europa''s hidden ocean can its surface
    reveal?


    The next major step is still ahead. For now, the data tell us why Europa is worth visiting and why a spacecraft
    will make so many passes before we can say what the ocean is really like.



    No single flyby can answer every question. The mission combines images, spectra, radar, magnetic measurements,
    and gravity observations to build a more complete picture over time. Those instruments observe different properties,
    and the team will compare their results rather than treating one measurement as a final verdict. That careful
    combination is the point of returning again and again.'
