- id: instruments
  chapter: What the spacecraft will measure
  sources:
  - S3
  - S4
  - S7
  narration: 'The mission carries nine science instruments, plus a gravity experiment using the spacecraft''s radio
    link. They work together during the encounters. Cameras and spectrometers map surface features and composition.
    Radar is designed to look below the ice. A magnetometer and plasma instruments study the moon''s interaction
    with Jupiter''s space environment. Thermal measurements help identify where the surface is unusually warm.


    The science is organized around three questions. What is inside Europa: how thick is the ice, and how does the
    interior connect to a possible ocean? What is the moon made of, from the surface to any material in its atmosphere?
    And how active is the surface: are cracks, ridges, or other features being renewed?


    The gravity experiment adds another view of the interior. As the spacecraft flies past, its motion changes slightly
    with Europa''s pull. Tracking that motion can help scientists infer how mass is distributed inside the moon.


    No single instrument answers the whole question. The mission combines images, spectra, radar, magnetic measurements,
    and gravity data so that one type of evidence can be checked against another.

    '
