- id: journey
  chapter: A journey measured in years
  sources:
  - S1
  - S2
  - S3
  narration: 'Europa Clipper launched on October fourteenth, twenty twenty-four, aboard a Falcon Heavy rocket. That
    launch is a completed event. The spacecraft then used Mars for a gravity assist on March first, twenty twenty-five,
    gaining a change in speed and direction from the planet''s motion around the Sun.


    The next major planetary assist is planned at Earth in December twenty twenty-six. As of October twenty-seventh,
    NASA and JPL describe that as a future maneuver. It has not happened yet. The spacecraft is scheduled to reach
    Jupiter in April twenty-thirty and enter orbit around the giant planet.


    The timeline stretches across years because Jupiter is far away and because the route saves propellant. Gravity
    assists trade a carefully chosen path past a moving planet for a change in the spacecraft''s trajectory. They
    are not engine burns, and they do not mean the spacecraft travels in a straight line from Earth to Europa.


    Before it begins its main Europa observations, the mission plan includes additional passes by Ganymede and Callisto.
    Those encounters help shape the orbit that will bring Europa into view again and again.

    '
