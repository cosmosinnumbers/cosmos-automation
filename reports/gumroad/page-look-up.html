s4gy3c5eud7lwbw60&quot;,&quot;original_url&quot;:&quot;https://public-files.gumroad.com/8zeqp4mbzirfvi0t6dmbho6iu47i&quot;,&quot;thumbnail&quot;:null,&quot;id&quot;:&quot;d95e343896e10e263ace2428b484f6a5&quot;,&quot;type&quot;:&quot;image&quot;,&quot;filetype&quot;:&quot;png&quot;,&quot;width&quot;:670,&quot;height&quot;:1005,&quot;native_width&quot;:1800,&quot;native_height&quot;:2700}],&quot;main_cover_id&quot;:&quot;d95e343896e10e263ace2428b484f6a5&quot;,&quot;thumbnail_url&quot;:&quot;https://public-files.gumroad.com/odxcln76suiofperk2whztdkhckw&quot;,&quot;quantity_remaining&quot;:null,&quot;long_url&quot;:&quot;https://cosmosinnumbers.gumroad.com/l/look-up&quot;,&quot;is_sales_limited&quot;:false,&quot;ratings&quot;:{&quot;count&quot;:0,&quot;average&quot;:0.0,&quot;percentages&quot;:[0,0,0,0,0]},&quot;seller_reputation&quot;:null,&quot;custom_button_text_option&quot;:null,&quot;is_compliance_blocked&quot;:false,&quot;is_published&quot;:true,&quot;is_stream_only&quot;:false,&quot;streamable&quot;:false,&quot;sales_count&quot;:null,&quot;summary&quot;:&quot;173 pages · 30+ outdoor exercises · 2027 sky calendar · 14 bonus posters · no telescope needed&quot;,&quot;attributes&quot;:[],&quot;description_html&quot;:&quot;\u003cp\u003e\u003cstrong\u003eYou don&#39;t need a telescope. You need to know where to look.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMost people who say \&quot;I can&#39;t see anything up there\&quot; never learned where and how to look. LOOK UP is a practical 173-page guide that takes complete beginners from their first night outside to finding another galaxy with binoculars, with every number linked to its source.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eLaunch price: $9 instead of $14 with code LAUNCH9, until 30 November 2026.\u003c/strong\u003e\u003c/p\u003e\u003ch3\u003eWhat you&#39;ll be able to do\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eFind the planets, the brightest stars and the main constellations on any clear night\u003c/li\u003e\n\u003cli\u003ePlan the best nights using the Moon phase, light pollution (Bortle scale) and the weather\u003c/li\u003e\n\u003cli\u003eCatch the best meteor showers of 2027 when the Moon won&#39;t spoil them\u003c/li\u003e\n\u003cli\u003eWatch the total solar eclipse of 2 August 2027 (up to 6 min 23 s of totality) safely\u003c/li\u003e\n\u003cli\u003ePhotograph the Moon and the stars with the phone you already have\u003c/li\u003e\n\u003cli\u003eChoose your first binoculars without wasting money\u003c/li\u003e\n\u003c/ul\u003e\u003ch3\u003eWhat&#39;s inside\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003e10 chapters, from your first night out to phone astrophotography\u003c/li\u003e\n\u003cli\u003eMore than 30 field exercises you do outside, each with the time, kit, steps and the result you should expect\u003c/li\u003e\n\u003cli\u003e36 practical tables you can read by red light, plus diagrams\u003c/li\u003e\n\u003cli\u003eA month-by-month 2027 sky calendar computed from NASA/JPL ephemeris data: Moon phases, the oppositions of Jupiter and Mars, Mercury&#39;s best dates for each hemisphere, and meteor showers ranked with the Moon taken into account\u003c/li\u003e\n\u003cli\u003eThe 30-Night Challenge: a checklist that takes you from beginner to confident observer\u003c/li\u003e\n\u003cli\u003eA printable observing log\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eBonus:\u003c/strong\u003e 14 print-ready data posters (planets, exoplanets, the spacecraft leaving our Solar System)\u003c/li\u003e\n\u003c/ul\u003e\u003ch3\u003eWho it&#39;s for\u003c/h3\u003e\u003cp\u003eCurious beginners, parents who want a clear-sky activity with their kids, and anyone who has just bought (or is about to buy) binoculars or a first telescope. If you already run a 10-inch Dobsonian, this book is too basic for you.\u003c/p\u003e\u003ch3\u003eFAQ\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003eDo I need a telescope?\u003c/strong\u003e No. Most of the book is naked eye; a chapter helps you choose binoculars if you want them.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eI live in a city. Will it work?\u003c/strong\u003e Yes. The Moon, the planets and the bright stars show through light pollution, and the book tells you what to expect at each level of the Bortle scale.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSouthern Hemisphere?\u003c/strong\u003e Yes. The book covers both hemispheres where the sky differs.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat format?\u003c/strong\u003e PDF (6×9 in, selectable text) and EPUB, instant download. Read it on your phone outside.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eNot sure yet?\u003c/strong\u003e Read Chapter 1 free: \u003ca href=\&quot;http://cosmosinnumbers.github.io/look-up.html\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer nofollow\&quot;\u003ecosmosinnumbers.github.io/look-up.htm\u003c/a\u003el\u003c/p\u003e\u003cp\u003eWritten with the help of AI tools and checked against the cited sources (NASA, JPL, IMO, peer-reviewed research). Photos credited (Unsplash License). NASA and the other organisations cited do not endorse this book.\u003c/p\u003e\u003cp\u003eBy Cosmos in Numbers: real space, real data. youtube.com/@CosmosinNumbers\u003c/p\u003e&quot;,&quot;currency_code&quot;:&quot;usd&quot;,&quot;price_cents&quot;:1400,&quot;buyer_currency_display&quot;:{&quot;product_id&quot;:&quot;8WWxtDd6lRqA7wWZ9hkvQg==&quot;,&quot;buyer_currency_shown&quot;:&quot;usd&quot;,&quot;product_currency&quot;:&quot;usd&quot;,&quot;buyer_local_price_cents&quot;:null,&quot;rate&quot;:null,&quot;display_mode&quot;:&quot;default&quot;},&quot;rental_price_cents&quot;:null,&quot;pwyw&quot;:null,&quot;eligible_for_installment_plans&quot;:true,&quot;allow_installment_plan&quot;:false,&quot;installment_plan&quot;:null,&quot;is_legacy_subscription&quot;:false,&quot;is_tiered_membership&quot;:false,&quot;is_recurring_billing&quot;:false,&quot;is_physical&quot;:false,&quot;custom_view_content_button_text&quot
